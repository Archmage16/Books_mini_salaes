<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Авторы</h2>

    <a href="/authors/add/">Добавить автора</a>

    <ul>
        {% for author in authors %}
            <li>{{ author.full_name }} (год рождения: {{ author.birth_year }})</li>
        {% empty %}
            <li>Пока нет авторов</li>
        {% endfor %}
    </ul>

    <a href="/">Назад на главную</a>


</body>
</html>
