

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Добавить персонажа Star Wars</title>
    </head>
    <body>
        <h1>Добавить персонажа Star Wars</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить</button>
        </form>

        {% if form.errors %}
            <div style="color:red;">
                <h3>Ошибки:</h3>
                {{ form.errors }}
            </div>
        {% endif %}
    </body>
</html>
