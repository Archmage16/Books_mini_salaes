<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Книга </title>
</head>
<body>
    {{ Title }}
    <form method="post" action="." enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Сохранить"/>
    </form>
    {% if form.errors %}
        <hr> {{ form.errors }}
    {% endif %}
</body>
</html>
